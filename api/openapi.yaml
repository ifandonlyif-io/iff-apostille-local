openapi: 3.1.0
info:
  title: Apostille Local
  version: 0.1.0-alpha.2
  description: >-
    Experimental, project-authenticated text inference gateway. Function-call
    messages are supported; tool execution belongs to the client. No RAG,
    cloud fallback or model administration API. Receipts are optional signed
    metadata assertions, not proof of output content or actual model execution.
servers:
  - url: https://gateway.example.internal:8443
security:
  - ProjectToken: []
paths:
  /healthz:
    get:
      operationId: health
      summary: Process liveness
      security: []
      responses:
        '200':
          description: Process is responding; does not establish runtime readiness.
  /readyz:
    get:
      operationId: readiness
      summary: Active runtime model readiness
      security: []
      responses:
        '200':
          description: Runtime advertises the active model and gateway is not draining.
        '503':
          $ref: '#/components/responses/Error'
  /v1/models:
    get:
      operationId: listModels
      summary: List the authenticated project's available active model
      description: >-
        Returns the active model only if authorized for this project and advertised
        by the runtime readiness check. Otherwise data is empty. The full configured
        catalog is not exposed; one model is active per deployment.
      responses:
        '200':
          description: Model catalog
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object: {const: list}
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, object, created, owned_by]
                      properties:
                        id: {type: string}
                        object: {const: model}
                        created: {const: 0, description: 'Placeholder; no model creation timestamp is asserted.'}
                        owned_by: {const: local}
        default:
          $ref: '#/components/responses/Error'
  /local/v1/capabilities:
    get:
      operationId: getCapabilities
      summary: Discover project-visible inference features and configured limits
      description: >-
        Includes only the healthy active model authorized for the caller, or an
        empty models array. Does not expose other projects, the inactive catalog,
        paths, secrets or model administration. Readiness and configured features
        are not hardware qualification or a capacity reservation.
      responses:
        '200':
          description: Versioned integration contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        default:
          $ref: '#/components/responses/Error'
  /v1/chat/completions:
    post:
      operationId: createChatCompletion
      summary: Generate one text completion or SSE stream
      description: >-
        Unknown request fields are rejected, including functions, seed, store
        and multimodal content. One choice only. Function calling requires the
        active model's administrator-enabled parser; the client executes tools.
        Tool history must pair every call with one result before subsequent
        messages. Tool arguments must be JSON objects; strict function definitions
        additionally enforce the declared bounded schema.
        No automatic retry: a network failure can occur after work has started.
        The run header is available once the gateway accepts a run.
        Request bodies are capped at 1 MiB. Runtime responses/streams are capped
        at 2 MiB in this preview.
      parameters:
        - in: header
          name: X-Apostille-Record
          required: false
          schema: {type: string, enum: [metadata]}
          description: Opt in to a producer-signed metadata receipt; no prompt/completion retention.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: >-
            JSON completion, or SSE data events containing OpenAI-style choice
            deltas followed by data: [DONE]. A stream error may occur after HTTP
            headers are sent. A missing [DONE] indicates an incomplete stream.
            Structured-output and tool-argument deltas are provisional until
            final validation succeeds and [DONE] is received. Requested usage is
            a final chunk with an empty choices array before [DONE].
          headers:
            X-Apostille-Run-ID:
              schema: {type: string}
              description: Correlation identifier; not an authorization credential.
          content:
            application/json:
              schema:
                type: object
                required: [choices]
                properties:
                  id: {type: string}
                  object: {type: string}
                  model: {type: string}
                  choices:
                    type: array
                    minItems: 1
                    maxItems: 1
                    items:
                      type: object
                      required: [message]
                      properties:
                        index: {type: integer}
                        message:
                          type: object
                          required: [role]
                          anyOf:
                            - required: [content]
                              properties:
                                content: {type: string}
                            - required: [tool_calls]
                              properties:
                                tool_calls: {minItems: 1}
                          properties:
                            role: {const: assistant}
                            content: {type: [string, 'null']}
                            tool_calls:
                              type: array
                              maxItems: 16
                              items: {$ref: '#/components/schemas/ToolCall'}
                        finish_reason: {enum: [stop, length, tool_calls]}
                  usage:
                    type: object
                    description: Runtime-reported token counts when available.
            text/event-stream:
              schema: {type: string}
        default:
          $ref: '#/components/responses/Error'
  /v1/messages:
    post:
      operationId: createMessage
      summary: Anthropic Messages API subset, served by the local model
      description: >-
        A translation layer over the same admission, validation, runtime call and
        receipt pipeline as /v1/chat/completions. Nothing is sent to Anthropic and
        the model is the administrator's local model; this is not full Anthropic
        compatibility. Accepts the project token in X-Api-Key or Authorization:
        Bearer (exactly one). Requires anthropic-version 2023-06-01 and rejects any
        anthropic-beta header. Unknown fields, image/document/thinking blocks,
        stop_sequences, top_k, metadata, cache_control, is_error true, assistant
        prefill and non-custom tools are rejected. Errors use the Anthropic error
        shape with a stable gateway code as message. Streaming tool_use blocks are
        emitted only after the whole stream validated; a response is final only
        after message_delta (with a stop_reason) and message_stop.
      security:
        - ProjectToken: []
        - ApiKey: []
      parameters:
        - in: header
          name: anthropic-version
          required: true
          schema: {const: '2023-06-01'}
        - in: header
          name: X-Apostille-Record
          required: false
          schema: {type: string, enum: [metadata]}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessagesRequest'
      responses:
        '200':
          description: Message JSON, or an SSE stream of Messages API events.
          headers:
            X-Apostille-Run-ID:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagesResponse'
            text/event-stream:
              schema: {type: string}
        default:
          description: Anthropic-shaped sanitized error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagesError'
  /local/v1/runs/{run_id}/evidence:
    get:
      operationId: getEvidence
      summary: Retrieve an opted-in run's metadata receipt
      description: >-
        Requires the same project's authorization. A run ID is not a capability.
        No automatic polling. The receipt status is independent of inference
        success. Embedded keys are not independent trust anchors.
      parameters:
        - in: path
          name: run_id
          required: true
          schema: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$'}
      responses:
        '200':
          description: Evidence state and available metadata
          content:
            application/json:
              schema:
                type: object
                required: [receipt_status]
                properties:
                  receipt_status:
                    type: string
                    enum: [pending, ready, failed]
                  manifest:
                    type: object
                    description: Gateway metadata assertion; no full-content binding claim.
                  bundle:
                    type: object
                    description: Apostille Core 0.1 bundle; exact wire semantics come from the pinned Core dependency.
                  manifest_base64:
                    type: string
                    contentEncoding: base64
                    contentMediaType: application/json
                    description: >-
                      Present only when ready. Standard padded Base64 of the exact
                      original manifest bytes. Decode for offline verification;
                      reserializing the manifest object can change the bytes.
                  bundle_base64:
                    type: string
                    contentEncoding: base64
                    contentMediaType: application/json
                    description: >-
                      Present only when ready. Standard padded Base64 of the exact
                      original Core 0.1 bundle bytes. Decode for offline verification.
                      Embedded keys are not independently selected trust pins.
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    ProjectToken:
      type: http
      scheme: bearer
      description: High-entropy project token, provisioned through a restricted file by the operator.
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: The same project token, accepted on /v1/messages only.
  responses:
    Error:
      description: >-
        Sanitized error; never includes request content, backend error bodies or
        credentials. Clients must not automatically retry.
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message, type]
                properties:
                  code: {type: string}
                  message: {type: string, description: 'Sanitized code; no upstream message.'}
                  type: {const: apostille_local_error}
  schemas:
    MessagesRequest:
      type: object
      additionalProperties: false
      required: [model, max_tokens, messages]
      properties:
        model: {type: string}
        max_tokens: {type: integer, minimum: 1}
        system:
          oneOf:
            - {type: string, minLength: 1}
            - type: array
              minItems: 1
              maxItems: 1
              items: {$ref: '#/components/schemas/MessagesTextBlock'}
        messages:
          type: array
          minItems: 1
          maxItems: 128
          description: The last message must have role user.
          items:
            type: object
            additionalProperties: false
            required: [role, content]
            properties:
              role: {enum: [user, assistant]}
              content:
                oneOf:
                  - {type: string, minLength: 1}
                  - type: array
                    minItems: 1
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/MessagesTextBlock'
                        - $ref: '#/components/schemas/MessagesToolUseBlock'
                        - $ref: '#/components/schemas/MessagesToolResultBlock'
        stream: {type: boolean}
        temperature: {type: number, minimum: 0, maximum: 1}
        top_p: {type: number, exclusiveMinimum: 0, maximum: 1}
        tools:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [name, input_schema]
            properties:
              type: {const: custom}
              name: {type: string}
              description: {type: string}
              strict: {type: boolean}
              input_schema: {type: object, description: Bounded JSON Schema subset, as for Chat Completions tools.}
        tool_choice:
          type: object
          required: [type]
          properties:
            type: {enum: [auto, any, none, tool]}
            name: {type: string, description: Required for type tool only.}
            disable_parallel_tool_use: {type: boolean, description: Not allowed with type none.}
        output_config:
          type: object
          additionalProperties: false
          required: [format]
          properties:
            format:
              type: object
              additionalProperties: false
              required: [type, schema]
              properties:
                type: {const: json_schema}
                schema: {type: object}
    MessagesTextBlock:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type: {const: text}
        text: {type: string, minLength: 1}
    MessagesToolUseBlock:
      type: object
      additionalProperties: false
      required: [type, id, name, input]
      properties:
        type: {const: tool_use}
        id: {type: string}
        name: {type: string}
        input: {type: object}
    MessagesToolResultBlock:
      type: object
      additionalProperties: false
      required: [type, tool_use_id]
      properties:
        type: {const: tool_result}
        tool_use_id: {type: string}
        content:
          oneOf:
            - {type: string}
            - type: array
              minItems: 1
              maxItems: 1
              items: {$ref: '#/components/schemas/MessagesTextBlock'}
        is_error: {const: false}
    MessagesResponse:
      type: object
      required: [id, type, role, model, content, stop_reason, stop_sequence, usage]
      properties:
        id: {type: string, description: 'msg_ followed by the run ID.'}
        type: {const: message}
        role: {const: assistant}
        model: {type: string}
        content:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/MessagesTextBlock'
              - $ref: '#/components/schemas/MessagesToolUseBlock'
        stop_reason: {enum: [end_turn, max_tokens, tool_use]}
        stop_sequence: {type: 'null'}
        usage:
          type: object
          required: [input_tokens, output_tokens]
          properties:
            input_tokens: {type: integer}
            output_tokens: {type: integer}
    MessagesError:
      type: object
      required: [type, error]
      properties:
        type: {const: error}
        error:
          type: object
          required: [type, message]
          properties:
            type: {enum: [invalid_request_error, authentication_error, permission_error, not_found_error, request_too_large, rate_limit_error, api_error]}
            message: {type: string, description: Stable gateway code; no backend text.}
    Capabilities:
      type: object
      required: [object, contract_version, api_family, gateway_version, models, evidence, tool_execution, unsupported]
      properties:
        object: {const: apostille_local.capabilities}
        contract_version: {const: '1'}
        api_family: {const: chat_completions}
        gateway_version: {type: string}
        models:
          type: array
          maxItems: 1
          items:
            type: object
            required: [id, max_context, max_output_tokens, max_concurrent_requests, features]
            properties:
              id: {type: string}
              max_context: {type: integer, minimum: 128}
              max_output_tokens: {type: integer, minimum: 1}
              max_concurrent_requests: {type: integer, minimum: 1}
              features:
                type: object
                required: [text, streaming, stream_usage, json_schema, tool_calling]
                properties:
                  text: {const: true}
                  streaming: {const: true}
                  stream_usage: {const: true}
                  json_schema: {const: true}
                  tool_calling:
                    type: boolean
                    description: Operator-enabled parser; not a claim that tools execute on the gateway.
        evidence:
          type: object
          required: [metadata, retention_seconds]
          properties:
            metadata: {type: boolean}
            retention_seconds: {const: 86400}
        compatible_apis:
          type: array
          items:
            type: object
            required: [family, path, anthropic_version]
            properties:
              family: {const: anthropic_messages}
              path: {const: /v1/messages}
              anthropic_version: {const: '2023-06-01'}
        tool_execution: {const: client}
        unsupported:
          type: array
          items: {type: string}
          example: [responses, embeddings, multimodal, server_tool_execution]
    ToolCall:
      type: object
      additionalProperties: false
      required: [id, type, function]
      properties:
        id: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
        type: {const: function}
        function:
          type: object
          additionalProperties: false
          required: [name, arguments]
          properties:
            name: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
            arguments:
              type: string
              description: Valid JSON object encoded as a string; at most 64 KiB of UTF-8 bytes.
    Tool:
      type: object
      additionalProperties: false
      required: [type, function]
      properties:
        type: {const: function}
        function:
          type: object
          additionalProperties: false
          required: [name, parameters]
          properties:
            name: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
            description:
              type: string
              description: At most 4096 UTF-8 bytes.
            strict: {type: boolean}
            parameters:
              type: object
              required: [type]
              description: >-
                Bounded schema subset described under response_format; root type
                must be object. strict=true validates generated arguments against
                this schema before successful completion.
              properties:
                type: {const: object}
    Message:
      oneOf:
        - type: object
          additionalProperties: false
          required: [role, content]
          properties:
            role: {enum: [system, user]}
            content: {type: string, minLength: 1}
        - type: object
          additionalProperties: false
          required: [role]
          properties:
            role: {const: assistant}
            content: {type: [string, 'null']}
            tool_calls:
              type: array
              maxItems: 16
              items: {$ref: '#/components/schemas/ToolCall'}
          anyOf:
            - required: [content]
              properties:
                content: {type: string, minLength: 1}
            - required: [tool_calls]
              properties:
                tool_calls: {minItems: 1}
        - type: object
          additionalProperties: false
          required: [role, content, tool_call_id]
          properties:
            role: {const: tool}
            content: {type: string}
            tool_call_id: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
    ChatRequest:
      type: object
      additionalProperties: false
      required: [model, messages]
      not:
        required: [max_tokens, max_completion_tokens]
      dependentSchemas:
        stream_options:
          required: [stream]
          properties:
            stream: {const: true}
      properties:
        model: {type: string, minLength: 1}
        messages:
          type: array
          minItems: 1
          maxItems: 128
          items: {$ref: '#/components/schemas/Message'}
        stream: {type: boolean, default: false}
        temperature: {type: number, minimum: 0, maximum: 2}
        top_p: {type: number, exclusiveMinimum: 0, maximum: 1}
        max_tokens: {type: integer, minimum: 1}
        max_completion_tokens:
          type: integer
          minimum: 1
          description: Alias for max_tokens; mutually exclusive. Bounded by the model output limit.
        n: {const: 1}
        stop:
          description: Each sequence is nonempty and at most 1024 UTF-8 bytes.
          oneOf:
            - {type: string, minLength: 1}
            - type: array
              minItems: 1
              maxItems: 4
              items: {type: string, minLength: 1}
        stream_options:
          type: object
          additionalProperties: false
          required: [include_usage]
          properties:
            include_usage: {type: boolean}
        tools:
          type: array
          maxItems: 64
          description: Unique function names; active model must have tool calling enabled.
          items: {$ref: '#/components/schemas/Tool'}
        tool_choice:
          description: >-
            Defaults to auto with tools and none without. Non-none choices require
            tool definitions. Named choices must reference a declared function.
            response_format requires effective tool_choice none.
          oneOf:
            - {type: string, enum: [none, auto, required]}
            - type: object
              additionalProperties: false
              required: [type, function]
              properties:
                type: {const: function}
                function:
                  type: object
                  additionalProperties: false
                  required: [name]
                  properties:
                    name: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
        parallel_tool_calls:
          type: boolean
          description: Requires nonempty tool definitions. false permits at most one generated call.
        response_format:
          type: object
          additionalProperties: false
          required: [type, json_schema]
          properties:
            type: {const: json_schema}
            json_schema:
              type: object
              additionalProperties: false
              required: [name, strict, schema]
              properties:
                name: {type: string, minLength: 1, maxLength: 96, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*$'}
                strict: {const: true}
                schema:
                  type: object
                  description: >-
                    Schema must be a JSON object; declared root type can be an
                    object, array or scalar. Bounded schema subset: type,
                    required, enum, const, minimum, maximum, minLength,
                    maxLength, minItems, maxItems, title, description,
                    properties (schema children), items (schema),
                    additionalProperties (boolean). Maximum depth 12 and
                    256 schema nodes. References, regex, applicators and remote
                    schema loading are rejected. This is not full JSON Schema.
                  properties:
                    type:
                      oneOf:
                        - {type: string}
                        - {type: array, items: {type: string}}
                  x-supported-keywords:
                    - type
                    - required
                    - enum
                    - const
                    - minimum
                    - maximum
                    - minLength
                    - maxLength
                    - minItems
                    - maxItems
                    - title
                    - description
                    - properties
                    - items
                    - additionalProperties
