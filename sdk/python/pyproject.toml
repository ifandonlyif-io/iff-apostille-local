[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "apostille-local"
version = "0.1.0a2"
description = "Python client for the experimental Apostille Local inference gateway"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1,<0.29"]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3"]

[tool.setuptools.packages.find]
where = ["src"]
